<!-- Modal Update -->
<div class="modal fade" id="staticBackdrop2" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="staticBackdropLabel2">Actualizar Producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">

                <form id="formUpdate">

                    <div class="mb-3">
                        <label class="form-label">Clave del producto</label>
                        <input type="text" class="form-control" id="claveProducto" name="claveProducto" readonly required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre del producto</label>
                        <input type="text" class="form-control" id="nombreProducto" name="nombreProducto" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio del producto</label>
                        <input type="number" class="form-control" id="precioProducto" name="precioProducto" step="0.01" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción del producto</label>
                        <textarea class="form-control" id="descripcion" rows="3" name="descripcion"></textarea>
                    </div>

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>

                </form>

            </div>
            <div class="modal-footer"></div>
            
        </div>
    </div>
</div>
