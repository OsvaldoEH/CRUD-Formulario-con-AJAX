<!-- Modal Insert -->
<div class="modal fade" id="staticBackdrop" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="staticBackdropLabel">Insertar Producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">

                <form id="formInsert">

                    <div class="mb-3">
                        <label class="form-label">Clave del producto</label>
                        <input type="text" class="form-control" placeholder="Clave del producto" name="claveProducto" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre del producto</label>
                        <input type="text" class="form-control" placeholder="Nombre del producto" name="nombreProducto" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio del producto</label>
                        <input type="number" class="form-control" placeholder="Precio del producto" name="precioProducto" step="0.01" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción del producto</label>
                        <textarea class="form-control" rows="3" placeholder="Descripción del producto" name="descripcion"></textarea>
                    </div>

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="submit" class="btn btn-primary">Registrar</button>
                    
                </form>

            </div>
            <div class="modal-footer"></div>
        </div>

    </div>
</div>
